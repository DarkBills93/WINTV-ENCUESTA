<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Soporte Técnico | WINTV</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 650px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); margin: auto; }
        .admin-bar { text-align: right; margin-bottom: 15px; }
        .admin-bar button { background-color: #1e293b; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; display: none; transition: background 0.2s; }
        .admin-bar button:hover { background-color: #0f172a; }
        
        h2 { color: #1e293b; margin-top: 0; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        /* Estilos para las Secciones */
        .section-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group:last-child { margin-bottom: 0; }
        label.question-label { display: block; margin-bottom: 10px; font-weight: 600; color: #334155; font-size: 13.5px; }
        input[type="text"], textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
        textarea { resize: vertical; height: 90px; }

        /* Estilos modernos para Radio Buttons interactivos tipo tarjeta */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13.5px;
            color: #334155;
        }
        .radio-option:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }
        .radio-option input[type="radio"] {
            margin-right: 10px;
            accent-color: #3b82f6;
            transform: scale(1.1);
            cursor: pointer;
        }
        /* Clase activa cuando el usuario selecciona la opción */
        .radio-option.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1e40af;
            font-weight: 600;
        }
        
        /* Contenedor de caritas SVG interactivas */
        .rating-container { display: flex; gap: 10px; cursor: pointer; justify-content: space-between; max-width: 360px; }
        .face-option {
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
            flex: 1;
        }
        .face-option svg { width: 38px; height: 38px; transition: transform 0.2s ease; }
        .face-option.inactive svg { filter: grayscale(100%); opacity: 0.4; }
        .face-option:hover, .face-option.active { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .face-option:hover svg, .face-option.active svg { filter: grayscale(0%); opacity: 1; transform: scale(1.1); }
        .face-option[data-value="1"].active { border-color: #ef4444; background: #fef2f2; }
        .face-option[data-value="2"].active { border-color: #f97316; background: #fff7ed; }
        .face-option[data-value="3"].active { border-color: #eab308; background: #fefce8; }
        .face-option[data-value="4"].active { border-color: #84cc16; background: #f7fee7; }
        .face-option[data-value="5"].active { border-color: #10b981; background: #ecfdf5; }

        /* Estilos para la barra de botones de recomendación (0 al 10) */
        .nps-container { display: flex; gap: 4px; justify-content: space-between; flex-wrap: wrap; }
        .nps-btn {
            flex: 1; min-width: 28px; padding: 9px 0; background-color: #fff; border: 1px solid #cbd5e1;
            border-radius: 6px; font-weight: 600; color: #334155; cursor: pointer; transition: all 0.2s; text-align: center; font-size: 13px;
        }
        .nps-btn:hover { background-color: #e2e8f0; }
        .nps-btn.active { background-color: #3b82f6; color: white; border-color: #2563eb; }

        button[type="submit"] { background-color: #10b981; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        button[type="submit"]:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-bar">
        <button id="btn-dashboard">📊 Ir al Dashboard</button>
    </div>

    <h2>Califica tu Experiencia en WINTV</h2>
    <p class="subtitle">Tu opinión es fundamental para asegurarnos de brindarte un servicio óptimo y seguir mejorando.</p>

    <form id="survey-form">
        <div class="form-group" style="margin-bottom: 22px;">
            <label class="question-label" for="cliente-nombre">Nombre y Apellido:</label>
            <input type="text" id="cliente-nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <!-- SECCIÓN 1: ATENCIÓN DE SOPORTE TÉCNICO -->
        <div class="section-card">
            <div class="section-title">📞 1. Atención por Soporte Técnico (Remoto / Central)</div>
            
            <div class="form-group">
                <label class="question-label">¿Cómo califica la rapidez en la atención de su reporte?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="tiempoRespuesta" value="Muy rápido" required> Muy rápido</label>
                    <label class="radio-option"><input type="radio" name="tiempoRespuesta" value="Adecuado"> Adecuado / A tiempo</label>
                    <label class="radio-option"><input type="radio" name="tiempoRespuesta" value="Lento"> Lento</label>
                    <label class="radio-option"><input type="radio" name="tiempoRespuesta" value="Muy lento"> Muy lento</label>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: VISITA TÉCNICA EN CAMPO -->
        <div class="section-card">
            <div class="section-title">🛠️ 2. Visita Técnica en Domicilio</div>

            <div class="form-group">
                <label class="question-label">¿Cómo califica la puntualidad y el trato del técnico?</label>
                <div class="rating-container" id="rating-faces">
                    <div class="face-option inactive" data-value="1" title="Malo">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#EF4444"/><path d="M8 9L10 11M16 9L14 11" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M9 16C10 14 14 14 15 16" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                    <div class="face-option inactive" data-value="2" title="Regular">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#F97316"/><circle cx="9" cy="10" r="1.5" fill="white"/><circle cx="15" cy="10" r="1.5" fill="white"/><path d="M9 15H15" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                    <div class="face-option inactive" data-value="3" title="Bueno">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#EAB308"/><circle cx="9" cy="10" r="1.5" fill="white"/><circle cx="15" cy="10" r="1.5" fill="white"/><line x1="9" y1="15" x2="15" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                    <div class="face-option inactive" data-value="4" title="Muy Bueno">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#84CC16"/><circle cx="9" cy="10" r="1.5" fill="white"/><circle cx="15" cy="10" r="1.5" fill="white"/><path d="M8 14C9.5 16 14.5 16 16 14" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                    <div class="face-option inactive" data-value="5" title="¡Excelente!">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#10B981"/><path d="M8 9L9.5 10.5M16 9L14.5 10.5" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="9" r="0.5" fill="white"/><circle cx="15" cy="9" r="0.5" fill="white"/><path d="M7 13C8.5 16 15.5 16 17 13" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
                    </div>
                </div>
                <input type="hidden" id="trato-tecnico-val" required>
            </div>

            <div class="form-group">
                <label class="question-label">¿Se brindó solución al inconveniente reportado?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="problemaResuelto" value="Si" required> Sí, totalmente solucionado</label>
                    <label class="radio-option"><input type="radio" name="problemaResuelto" value="Parcial"> Parcialmente solucionado</label>
                    <label class="radio-option"><input type="radio" name="problemaResuelto" value="No"> No se solucionó</label>
                </div>
            </div>

            <div class="form-group">
                <label class="question-label">¿El técnico dejó el área de trabajo limpia y ordenada?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="limpiezaOrden" value="Sí, completamente ordenado" required> Sí, completamente ordenado</label>
                    <label class="radio-option"><input type="radio" name="limpiezaOrden" value="Más o menos"> Más o menos</label>
                    <label class="radio-option"><input type="radio" name="limpiezaOrden" value="No, dejó desordenado"> No, dejó desordenado</label>
                </div>
            </div>

            <div class="form-group">
                <label class="question-label">¿El técnico le explicó claramente el origen del problema y la solución?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="explicacionProblema" value="Sí, muy claro" required> Sí, muy claro</label>
                    <label class="radio-option"><input type="radio" name="explicacionProblema" value="Parcialmente"> Parcialmente</label>
                    <label class="radio-option"><input type="radio" name="explicacionProblema" value="No explicó nada"> No explicó nada</label>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 3: VALORACIÓN GENERAL -->
        <div class="section-card">
            <div class="section-title">⭐ 3. Valoración General</div>

            <div class="form-group">
                <label class="question-label">¿Recomendaría nuestros servicios de internet/soporte?</label>
                <div class="nps-container" id="nps-rating">
                    <button type="button" class="nps-btn" data-value="0">0</button>
                    <button type="button" class="nps-btn" data-value="1">1</button>
                    <button type="button" class="nps-btn" data-value="2">2</button>
                    <button type="button" class="nps-btn" data-value="3">3</button>
                    <button type="button" class="nps-btn" data-value="4">4</button>
                    <button type="button" class="nps-btn" data-value="5">5</button>
                    <button type="button" class="nps-btn" data-value="6">6</button>
                    <button type="button" class="nps-btn" data-value="7">7</button>
                    <button type="button" class="nps-btn" data-value="8">8</button>
                    <button type="button" class="nps-btn" data-value="9">9</button>
                    <button type="button" class="nps-btn" data-value="10">10</button>
                </div>
                <input type="hidden" id="recomendaria-val" required>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label class="question-label" for="comentarios">Comentarios u observaciones adicionales:</label>
                <textarea id="comentarios" placeholder="Escribe aquí si tienes algún detalle adicional que reportar..."></textarea>
            </div>
        </div>

        <button type="submit">Enviar Evaluación</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_AUTH_DOMAIN",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_STORAGE_BUCKET",
        messagingSenderId: "TU_MESSAGING_SENDER_ID",
        appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const btnDashboard = document.getElementById('btn-dashboard');
    const surveyForm = document.getElementById('survey-form');
    
    // Interactividad avanzada para las tarjetas de radio buttons
    document.querySelectorAll('.radio-group').forEach(group => {
        const options = group.querySelectorAll('.radio-option');
        options.forEach(opt => {
            const radio = opt.querySelector('input[type="radio"]');
            
            // Marcar visualmente al hacer clic en toda la tarjeta
            opt.addEventListener('click', () => {
                radio.checked = true;
                options.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
            });
        });
    });

    const faceOptions = document.querySelectorAll('.face-option');
    const hiddenInputFace = document.getElementById('trato-tecnico-val');

    faceOptions.forEach(option => {
        option.addEventListener('mouseenter', () => {
            highlightFaces(option.getAttribute('data-value'));
        });

        document.getElementById('rating-faces').addEventListener('mouseleave', () => {
            highlightFaces(hiddenInputFace.value);
        });

        option.addEventListener('click', () => {
            const val = option.getAttribute('data-value');
            hiddenInputFace.value = val;
            highlightFaces(val);
        });
    });

    function highlightFaces(count) {
        faceOptions.forEach(opt => {
            if (count && opt.getAttribute('data-value') <= count) {
                opt.classList.add('active');
                opt.classList.remove('inactive');
            } else {
                opt.classList.remove('active');
                opt.classList.add('inactive');
            }
        });
    }

    const npsButtons = document.querySelectorAll('.nps-btn');
    const hiddenInputNps = document.getElementById('recomendaria-val');

    npsButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            npsButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            hiddenInputNps.value = btn.getAttribute('data-value');
        });
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === "admin") {
                    btnDashboard.style.display = "inline-block";
                }
            } catch (error) {
                console.error("Error al verificar privilegios:", error);
            }
        }
    });

    surveyForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const dataEncuesta = {
            clienteNombre: document.getElementById('cliente-nombre').value,
            tiempoRespuesta: document.querySelector('input[name="tiempoRespuesta"]:checked')?.value || "",
            tratoTecnicoCaritas: parseInt(hiddenInputFace.value),
            problemaResuelto: document.querySelector('input[name="problemaResuelto"]:checked')?.value || "",
            limpiezaOrden: document.querySelector('input[name="limpiezaOrden"]:checked')?.value || "",
            explicacionProblema: document.querySelector('input[name="explicacionProblema"]:checked')?.value || "",
            recomendaria: parseInt(hiddenInputNps.value),
            comentarios: document.getElementById('comentarios').value,
            fechaCreacion: new Date()
        };

        try {
            await addDoc(collection(db, "encuestas_soporte"), dataEncuesta);
            alert("¡Muchas gracias! Tu respuesta ha sido registrada exitosamente.");
            surveyForm.reset();
            hiddenInputFace.value = "";
            hiddenInputNps.value = "";
            highlightFaces(0);
            npsButtons.forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
        } catch (error) {
            console.error("Error al guardar en Firebase: ", error);
            alert("Ocurrió un error al enviar el formulario. Inténtalo de nuevo.");
        }
    });

    btnDashboard.addEventListener('click', () => {
        window.location.href = "dashboard.html";
    });
</script>

</body>
</html>
